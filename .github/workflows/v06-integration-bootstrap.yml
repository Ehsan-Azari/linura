name: v0.6 integration bootstrap

on:
  push:
    branches: ["tmp/v06-managed-lifecycle"]
    paths: [".github/workflows/v06-integration-bootstrap.yml"]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/v06-managed-lifecycle
          fetch-depth: 0
      - name: Apply deterministic v0.6 composition patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lock = Path('Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          marker = '[[package]]\nname = "linura-bootstrap"\n'
          entry = '''[[package]]
          name = "linura-authorityd"
          version = "0.5.0"
          dependencies = [
           "blocking",
           "linura-control",
           "linura-core",
           "linura-executor-systemd",
           "linura-linux-observation",
           "linura-observation-control",
           "linura-persistence-sqlite",
           "linura-protocol",
           "linura-provider-sdk",
           "linura-transaction",
           "linura-verifier-systemd",
           "zbus",
          ]

          '''
          entry = '\n'.join(line.lstrip() for line in entry.splitlines()) + '\n'
          if 'name = "linura-authorityd"' not in text:
              if marker not in text:
                  raise SystemExit('Cargo.lock insertion marker missing')
              text = text.replace(marker, entry + marker, 1)
              lock.write_text(text, encoding='utf-8')

          managed = Path('crates/linura-control/src/managed_lifecycle.rs')
          text = managed.read_text(encoding='utf-8')
          old = 'let unit = managed_unit_from_resource(resource.as_str())?;'
          new = 'let unit = managed_unit_from_resource(resource.as_str())?.to_owned();'
          if old not in text:
              if new not in text:
                  raise SystemExit('managed effect ownership patch marker missing')
          else:
              text = text.replace(old, new, 1)
              managed.write_text(text, encoding='utf-8')

          layering = Path('tools/check_layering.py')
          text = layering.read_text(encoding='utf-8')
          replacements = {
              'TRANSACTION_CONSUMERS = {"linura-control", "linura-persistence-sqlite"}': 'TRANSACTION_CONSUMERS = {"linura-control", "linura-persistence-sqlite", "linura-authorityd"}',
              'PERSISTENCE_CONSUMERS: set[str] = set()': 'PERSISTENCE_CONSUMERS = {"linura-authorityd"}',
              'TRANSACTION_ALLOWED_CONSUMERS = {"linura-control", "linura-persistence-sqlite"}': 'TRANSACTION_ALLOWED_CONSUMERS = {"linura-control", "linura-persistence-sqlite", "linura-authorityd"}',
              '"linura-transaction may be consumed only by Control and the SQLite adapter; found policy consumers: "': '"linura-transaction may be consumed only by Control, the SQLite adapter and the trusted v0.6 authority runtime; found policy consumers: "',
              '"linura-persistence-sqlite has no direct production consumer in v0.4; found: "': '"linura-persistence-sqlite may be consumed directly only by the trusted v0.6 authority runtime; found: "',
              '"linura-transaction may be consumed only by linura-control and "\n            "linura-persistence-sqlite; found unexpected consumers: "': '"linura-transaction may be consumed only by linura-control, "\n            "linura-persistence-sqlite and linura-authorityd; found unexpected consumers: "',
          }
          for old_text, new_text in replacements.items():
              if old_text in text:
                  text = text.replace(old_text, new_text, 1)
          layering.write_text(text, encoding='utf-8')

          image = Path('tools/image.py')
          text = image.read_text(encoding='utf-8')
          marker = '    "linura-executor-systemd": "usr/lib/linura/linura-executor-systemd",\n'
          addition = marker + '    "linura-authorityd": "usr/lib/linura/linura-authorityd",\n'
          if '"linura-authorityd"' not in text:
              if marker not in text:
                  raise SystemExit('image binary insertion marker missing')
              text = text.replace(marker, addition, 1)
              image.write_text(text, encoding='utf-8')
          PY

      - name: Format and compile exact workspace
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --locked
          python3 tools/check_layering.py

      - name: Commit only validated composition edits
        run: |
          set -euo pipefail
          git rm .github/workflows/v06-integration-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock tools/check_layering.py tools/image.py Cargo.toml apps/ crates/ executors/ verifiers/ packaging/ docs/
          git diff --cached --check
          git commit -m "wip(v0.6): integrate trusted managed authority runtime"
          git push origin HEAD:tmp/v06-managed-lifecycle
