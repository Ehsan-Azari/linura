name: Bootstrap Rust formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-rust-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Use pinned Rust toolchain
        run: rustup default 1.98.0
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.rs'; then
            echo "Rust workspace already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git diff --cached --check
          git commit -m "style: format Rust workspace"
          git push origin HEAD:main
