name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      RUST_VERSION: "1.98.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - run: rustup default "$RUST_VERSION"
      - name: Restore exact cargo-audit binary cache
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust-1.98.0-v0.22.2
      - name: Install cargo-audit on cache miss
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: Verify pinned audit tool identity
        run: |
          set -euo pipefail
          test -x "$HOME/.cargo/bin/cargo-audit"
          "$HOME/.cargo/bin/cargo-audit" --version | grep -F " $CARGO_AUDIT_VERSION"
      - name: Audit Rust dependencies
        run: "$HOME/.cargo/bin/cargo-audit" audit
