name: Temporary v0.3 final review corrections

on:
  push:
    branches: [feat/v0.3-approval-lifecycle-clean]
    paths:
      - tools/v03_final_review_fix.py
      - .github/workflows/v03-final-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert exact staged lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d45159fd3f32db028ef576d522abf9832d7bb6cf"
          test "$(git rev-parse HEAD^^)" = "0195543fc0e2cfd225a2142175dac069539da3e6"
      - name: Install canonical development environment
        run: bash scripts/setup_codex_environment.sh
      - name: Verify clean exact environment before edits
        run: bash scripts/preflight_codex_environment.sh --full
      - name: Apply asserted final review corrections
        run: python3 tools/v03_final_review_fix.py
      - name: Format and validate transformed source
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test -p linura-control
          cargo test -p linura-dbus
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo xtask check
      - name: Remove temporary patch machinery
        run: rm -f tools/v03_final_review_fix.py .github/workflows/v03-final-review-fix.yml
      - name: Verify intended diff and commit
        run: |
          set -euo pipefail
          actual="$(git diff --name-only 0195543fc0e2cfd225a2142175dac069539da3e6 | sort)"
          expected="$(printf '%s\n' 'crates/linura-control/src/approval_review.rs' 'crates/linura-dbus/src/planning.rs' 'docs/threat-model.md' | sort)"
          test "$actual" = "$expected"
          git diff --check
          git status --short
          git config user.name "Ehsan Azari"
          git config user.email "im.ehsan.azari@gmail.com"
          git add -A
          git commit -m "fix(authority): close final v0.3 review gaps"
          git push origin HEAD:feat/v0.3-approval-lifecycle-clean
