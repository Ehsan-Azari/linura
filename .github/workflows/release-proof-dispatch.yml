name: Release proof dispatch

on:
  workflow_run:
    workflows: ["CI", "Security", "CodeQL"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: release-proof-dispatch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_commit.message, 'release: v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Resolve and validate release intent
        id: release
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$main_sha" = "$SOURCE_SHA"
          subject="$(git log -1 --pretty=%s)"
          python3 - "$subject" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          subject, output_path = sys.argv[1], sys.argv[2]
          match = re.fullmatch(
              r"release: (?P<tag>v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?) — (?P<theme>\S.*)",
              subject,
          )
          if match is None:
              raise SystemExit(f"invalid release-intent subject: {subject!r}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"tag={match.group('tag')}\n")
              handle.write(f"theme={match.group('theme')}\n")
          PY
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          python3 tools/release_contract.py validate --tag "$tag" --notes "docs/releases/${tag}.md" --require-workspace-version
      - name: Require exact-main permanent gates
        run: |
          set -euo pipefail
          workflows=(ci.yml security.yml codeql.yml)
          for attempt in $(seq 1 30); do
            pending=0
            for workflow in "${workflows[@]}"; do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&event=push&per_page=1")"
              status="$(jq -r '.workflow_runs[0].status // "missing"' <<<"$payload")"
              conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$payload")"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "$workflow failed for $SOURCE_SHA with conclusion $conclusion" >&2
                exit 1
              fi
              if [[ "$status" != "completed" ]]; then
                pending=1
              fi
            done
            if [[ "$pending" -eq 0 ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for exact-main permanent gates" >&2
          exit 1
      - name: Create immutable tag and dispatch candidate once
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if tag_payload="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            tag_sha="$(jq -r .object.sha <<<"$tag_payload")"
            test "$tag_sha" = "$SOURCE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA" >/dev/null
          fi

          existing_run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$SOURCE_SHA&per_page=20" \
              | jq -r --arg tag "$RELEASE_TAG" '.workflow_runs[] | select(.head_branch == $tag) | .id' \
              | head -1
          )"
          if [[ -n "$existing_run" ]]; then
            echo "candidate already exists for $RELEASE_TAG: $existing_run"
            exit 0
          fi

          gh workflow run release.yml --ref "$RELEASE_TAG"
