name: Temporary v0.4 lockfile refresh

on:
  push:
    branches:
      - chore/v0.4.0-release-prep
    paths:
      - .github/workflows/v04-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    name: refresh workspace package versions only
    if: ${{ !contains(github.event.head_commit.message, 'chore(release): refresh v0.4 lockfile') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: chore/v0.4.0-release-prep

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          source tools/codex/versions.env
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Refresh and verify lockfile delta
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo metadata --format-version 1 >/dev/null
          python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          import sys
          import tomllib

          before_path, after_path = sys.argv[1:]
          before_text = open(before_path, encoding="utf-8").read()
          after_text = open(after_path, encoding="utf-8").read()
          before = tomllib.loads(before_text)
          after = tomllib.loads(after_text)

          before_packages = {p["name"]: p for p in before["package"]}
          after_packages = {p["name"]: p for p in after["package"]}
          expected = {
              name
              for name, package in before_packages.items()
              if "source" not in package and package.get("version") == "0.3.0"
          }
          changed = set()
          for name, old in before_packages.items():
              new = after_packages.get(name)
              if new is None:
                  raise SystemExit(f"lockfile package disappeared: {name}")
              if old != new:
                  old_copy = dict(old)
                  new_copy = dict(new)
                  old_version = old_copy.pop("version", None)
                  new_version = new_copy.pop("version", None)
                  if old_copy != new_copy or old_version != "0.3.0" or new_version != "0.4.0" or "source" in old:
                      raise SystemExit(f"unexpected lockfile mutation for {name}: {old_version!r} -> {new_version!r}")
                  changed.add(name)
          if changed != expected:
              raise SystemExit(f"workspace lockfile version set mismatch: expected={sorted(expected)} changed={sorted(changed)}")
          if not changed:
              raise SystemExit("no workspace package versions changed")
          print(f"verified {len(changed)} workspace package version updates")
          PY

      - name: Commit generated lockfile and remove temporary workflow
        env:
          BRANCH: chore/v0.4.0-release-prep
        run: |
          set -euo pipefail
          rm .github/workflows/v04-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/v04-lockfile-refresh.yml
          git diff --cached --check
          git commit -m "chore(release): refresh v0.4 lockfile"
          git push origin "HEAD:$BRANCH"
