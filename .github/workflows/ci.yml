name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate GitHub workflow expression contexts
        run: ruby scripts/check_workflow_contexts.rb
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Use pinned Rust toolchain
        run: rustup default 1.98.0
      - name: Run canonical Linura checks
        run: cargo xtask check
      - name: Validate Python tooling syntax
        run: python3 -m compileall -q scripts tools
      - name: Validate shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find packaging -type f -name '*.sh' -print0)
