name: Promote verified release candidate

on:
  workflow_run:
    workflows: ["Trusted release candidate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Trusted release candidate workflow run ID
        required: true
        type: string
      expected_sha:
        description: Exact source commit SHA expected in the candidate
        required: true
        type: string
      tag:
        description: Existing immutable release tag, for example v0.1.0
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-promotion-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.candidate_run_id }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify candidate workflow identity and success
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .conclusion)"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)"
          workflow_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .name)"
          test "$conclusion" = success
          test "$head_sha" = "$EXPECTED_SHA"
          test "$workflow_name" = "Trusted release candidate"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download exact candidate artifact
        run: gh run download "$CANDIDATE_RUN_ID" --name linura-release-candidate --dir candidate
      - name: Resolve tag and verify candidate contents
        run: |
          set -euo pipefail
          release_tag="$(cat candidate/RELEASE_TAG)"
          test -n "$release_tag"
          if [[ -n "$INPUT_TAG" ]]; then
            test "$release_tag" = "$INPUT_TAG"
          fi
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          test "$(cat candidate/SOURCE_SHA)" = "$EXPECTED_SHA"
          git fetch --tags --force origin
          test "$(git rev-list -n1 "$release_tag")" = "$EXPECTED_SHA"
          python3 tools/release_contract.py verify --directory candidate --tag "$release_tag" --source-sha "$EXPECTED_SHA"
          python3 tools/release_verify.py candidate
      - name: Publish verified bytes and frozen notes
        run: |
          set -euo pipefail
          expected_title="Linura $RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            actual_title="$(gh release view "$RELEASE_TAG" --json name --jq .name)"
            test "$actual_title" = "$expected_title"
            echo "release already exists with canonical title; preserving published object"
          else
            gh release create "$RELEASE_TAG" candidate/* \
              --verify-tag \
              --title "$expected_title" \
              --notes-file candidate/RELEASE_NOTES.md
          fi
      - name: Dispatch independent publication verification
        run: gh workflow run release-verification.yml --ref main -f tag="$RELEASE_TAG"
