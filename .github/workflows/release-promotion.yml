name: Promote verified release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Trusted release candidate workflow run ID
        required: true
        type: string
      expected_sha:
        description: Exact source commit SHA expected in the candidate
        required: true
        type: string
      tag:
        description: Existing immutable release tag, for example v0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify candidate workflow identity and success
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .conclusion)"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)"
          workflow_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .name)"
          test "$conclusion" = success
          test "$head_sha" = "$EXPECTED_SHA"
          test "$workflow_name" = "Trusted release candidate"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$EXPECTED_SHA"
      - name: Download exact candidate artifact
        run: gh run download "$CANDIDATE_RUN_ID" --name linura-release-candidate --dir candidate
      - name: Verify candidate contents and frozen claim
        run: |
          set -euo pipefail
          test "$(cat candidate/SOURCE_SHA)" = "$EXPECTED_SHA"
          test "$(cat candidate/RELEASE_TAG)" = "$RELEASE_TAG"
          python3 tools/release_contract.py verify --directory candidate --tag "$RELEASE_TAG" --source-sha "$EXPECTED_SHA"
          python3 tools/release_verify.py candidate
      - name: Publish GitHub Release from verified bytes and notes
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" candidate/* --verify-tag --title "Linura $RELEASE_TAG" --notes-file candidate/RELEASE_NOTES.md
