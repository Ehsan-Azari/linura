name: Temporary v0.3 completion patch

on:
  push:
    branches: [feat/v0.3-approval-lifecycle-clean]
    paths:
      - tools/v03_complete.py
      - tools/v03_fix.py
      - .github/workflows/v03-completion-patch.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert exact staged lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "61cdf4caf5da20a0408ef6d1296789eca4e671df"
          test "$(git rev-parse HEAD^)" = "4f2e6481d3c719bf4f59918d99b814021dc3e5d6"
      - name: Install canonical development environment
        run: bash scripts/setup_codex_environment.sh
      - name: Verify clean exact environment before edits
        run: bash scripts/preflight_codex_environment.sh --full
      - name: Apply asserted v0.3 completion transformation
        run: |
          python3 tools/v03_complete.py
          python3 tools/v03_fix.py
      - name: Format and validate transformed source
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test -p linura-control
          cargo test -p linura-protocol
          cargo test -p linura-dbus
          cargo test -p linuractl
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo xtask check
      - name: Remove temporary patch machinery
        run: rm -f tools/v03_complete.py tools/v03_fix.py .github/workflows/v03-completion-patch.yml
      - name: Verify intended diff and commit
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "Ehsan Azari"
          git config user.email "im.ehsan.azari@gmail.com"
          git add -A
          git commit -m "feat(control): complete v0.3 retained plan review"
          git push origin HEAD:feat/v0.3-approval-lifecycle-clean
