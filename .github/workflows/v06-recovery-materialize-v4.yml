name: v0.6 recovery materialization v4

on:
  pull_request:
    paths:
      - ".github/workflows/v06-recovery-materialize-v4.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'tmp/v06-managed-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/v06-managed-lifecycle
          fetch-depth: 0
      - name: Install repository toolchain
        run: |
          set -euo pipefail
          source tools/codex/versions.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
      - name: Reuse successful semantic-anchor transform
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/v06-recovery-materialize-v3.yml').read_text(encoding='utf-8').splitlines()
          marker = "          python3 - <<'PY'"
          start = source.index(marker) + 1
          body = []
          for line in source[start:]:
              if line == '          PY':
                  break
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected materializer indentation: {line!r}')
              body.append(line[10:])
          else:
              raise SystemExit('materializer terminator not found')
          Path('/tmp/v06-materialize.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python3 /tmp/v06-materialize.py

          python3 - <<'PY'
          from pathlib import Path

          durable = Path('crates/linura-control/src/durable_authority.rs')
          text = durable.read_text(encoding='utf-8')
          marker = 'pub struct FreshRecoveryApproval {'
          if '#[derive(Debug)]\npub struct FreshRecoveryApproval {' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('FreshRecoveryApproval marker missing')
              text = text.replace(marker, '#[derive(Debug)]\n' + marker, 1)
          durable.write_text(text, encoding='utf-8')

          qualification = Path('crates/linura-control/src/v06_qualification.rs')
          text = qualification.read_text(encoding='utf-8')
          helper_marker = '''fn value<T, E: Debug>(result: Result<T, E>) -> T {
              result.unwrap_or_else(|error| unreachable!("{error:?}"))
          }
          '''
          helper = helper_marker + '''
          trait ResultErrorExt<T, E> {
              fn error_or_unreachable(self) -> E;
          }

          impl<T, E> ResultErrorExt<T, E> for Result<T, E> {
              fn error_or_unreachable(self) -> E {
                  match self {
                      Ok(_) => unreachable!("expected operation to fail"),
                      Err(error) => error,
                  }
              }
          }
          '''
          if 'trait ResultErrorExt' not in text:
              if helper_marker not in text:
                  raise SystemExit('qualification helper marker missing')
              text = text.replace(helper_marker, helper, 1)
          count = text.count('.unwrap_err()')
          if count == 0:
              raise SystemExit('expected unwrap_err calls were not found')
          text = text.replace('.unwrap_err()', '.error_or_unreachable()')
          qualification.write_text(text, encoding='utf-8')
          print(f'replaced {count} unwrap_err calls')
          PY
      - name: Validate exact recovery semantics and lint cleanliness
        run: |
          set -euo pipefail
          cargo check -p linura-control --tests
          cargo fmt --all
          cargo test --locked -p linura-control v06_qualification::
          cargo clippy --locked -p linura-control --tests -- -D warnings
          git diff --check
      - name: Commit proven source and retire recovery bootstraps
        run: |
          set -euo pipefail
          git rm -f .github/workflows/v06-recovery-materialize.yml .github/workflows/v06-recovery-materialize-v3.yml .github/workflows/v06-recovery-materialize-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/linura-control/src/durable_authority.rs crates/linura-control/src/lib.rs crates/linura-control/src/managed_lifecycle.rs crates/linura-control/src/v06_qualification.rs
          git diff --cached --check
          git commit -m "fix(v0.6): bind recovery approval to fresh evidence"
          git push origin HEAD:tmp/v06-managed-lifecycle
