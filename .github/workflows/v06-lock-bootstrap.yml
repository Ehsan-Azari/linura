name: v0.6 architecture correction bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/v06-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  validate-and-land:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'tmp/v06-managed-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/v06-managed-lifecycle
          fetch-depth: 0

      - name: Load pinned Rust toolchain
        run: |
          set -euo pipefail
          source tools/codex/versions.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Land validated v0.6 recovery semantics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          managed = Path("crates/linura-control/src/managed_lifecycle.rs")
          text = managed.read_text(encoding="utf-8")
          marker = 'pub const MANAGED_SYSTEMD_CAPABILITY: &str = "systemd.unit.observe";\n'
          addition = marker + 'pub const MANAGED_SYSTEMD_INTENT_ORIGIN: &str = "intent:v06:managed-systemd-active-state";\n'
          if "MANAGED_SYSTEMD_INTENT_ORIGIN" not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f"managed intent marker count={text.count(marker)}")
              text = text.replace(marker, addition, 1)

          old = '''        let approval_evidence_id =
              if verification.disposition == VerificationDisposition::NotSatisfied {
                  let candidate = self.authority.candidate(
                      &mut self.previews,
                      principal.clone(),
                      actor.clone(),
                      request.clone(),
                  )?;
                  let canonical_effect = effect_from_candidate(&candidate)?;
                  if canonical_effect != effect {
                      return Err(ManagedLifecycleError::Contract(
                          "recovery candidate substituted the originally bound effect".into(),
                      ));
                  }
                  self.authorize_candidate(&candidate, approval)?
              } else {
                  None
              };

          let recovery = self.authority.recover_indeterminate(
              &mut self.previews,
              principal.clone(),
              actor.clone(),
              request.clone(),
              approval_evidence_id,
          )?;
          '''
          new = '''        let recovery = if verification.disposition == VerificationDisposition::NotSatisfied {
              let approver = PolicyAuthenticatedApprover::new(
                  approval.principal().clone(),
                  ActorKind::Human,
                  BTreeSet::from([ApprovalClass::Administrator]),
              );
              let approval_request = ApprovalRequestId::new(format!(
                  "approval:v06:recovery:{}",
                  request.request_id.as_str()
              ))
              .map_err(|error| ManagedLifecycleError::Contract(error.to_string()))?;
              let expires_at = now_unix_seconds()?
                  .checked_add(MANAGED_APPROVAL_TTL_SECONDS)
                  .ok_or_else(|| ManagedLifecycleError::Contract("approval clock overflow".into()))?;
              self.authority.recover_indeterminate_with_approver(
                  &mut self.previews,
                  principal.clone(),
                  actor.clone(),
                  request.clone(),
                  FreshRecoveryApproval::new(approval_request, approver, expires_at),
              )?
          } else {
              self.authority.recover_indeterminate(
                  &mut self.previews,
                  principal.clone(),
                  actor.clone(),
                  request.clone(),
                  None,
              )?
          };
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "FreshRecoveryApproval::new" not in text:
              raise SystemExit("managed recovery block not found")
          managed.write_text(text, encoding="utf-8")

          durable = Path("crates/linura-control/src/durable_authority.rs")
          text = durable.read_text(encoding="utf-8")
          marker = '''pub enum DurableRecoveryOutcome {
              Verified(VerifiedDurableAuthority),
              Reprepared(Box<PreparedDurableAuthority>),
              Blocked(TransactionSnapshot),
              StillIndeterminate(TransactionSnapshot),
          }
          '''
          addition = marker + '''
          pub struct FreshRecoveryApproval {
              request_id: ApprovalRequestId,
              approver: PolicyAuthenticatedApprover,
              expires_at_unix_seconds: u64,
          }

          impl FreshRecoveryApproval {
              #[must_use]
              pub fn new(
                  request_id: ApprovalRequestId,
                  approver: PolicyAuthenticatedApprover,
                  expires_at_unix_seconds: u64,
              ) -> Self {
                  Self {
                      request_id,
                      approver,
                      expires_at_unix_seconds,
                  }
              }
          }

          enum RecoveryApproval {
              Existing(Option<ApprovalEvidenceId>),
              OnDemand(FreshRecoveryApproval),
          }
          '''
          if "enum RecoveryApproval" not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f"recovery outcome marker count={text.count(marker)}")
              text = text.replace(marker, addition, 1)

          old = '''    pub fn recover_indeterminate(
              &mut self,
              previews: &mut PlanPreviewControl,
              principal: AuthenticatedPrincipal,
              actor: Actor,
              request: PlanDesiredStateRequest,
              approval_evidence_id: Option<ApprovalEvidenceId>,
          ) -> Result<DurableRecoveryOutcome, DurableAuthorityError> {
          '''
          new = '''    pub fn recover_indeterminate(
              &mut self,
              previews: &mut PlanPreviewControl,
              principal: AuthenticatedPrincipal,
              actor: Actor,
              request: PlanDesiredStateRequest,
              approval_evidence_id: Option<ApprovalEvidenceId>,
          ) -> Result<DurableRecoveryOutcome, DurableAuthorityError> {
              self.recover_indeterminate_inner(
                  previews,
                  principal,
                  actor,
                  request,
                  RecoveryApproval::Existing(approval_evidence_id),
              )
          }

          /// Recover using approval authority bound to the exact fresh recovery
          /// candidate. Approval is minted only after the recovery observation
          /// that will be rebound into the new prepared generation.
          pub fn recover_indeterminate_with_approver(
              &mut self,
              previews: &mut PlanPreviewControl,
              principal: AuthenticatedPrincipal,
              actor: Actor,
              request: PlanDesiredStateRequest,
              approval: FreshRecoveryApproval,
          ) -> Result<DurableRecoveryOutcome, DurableAuthorityError> {
              self.recover_indeterminate_inner(
                  previews,
                  principal,
                  actor,
                  request,
                  RecoveryApproval::OnDemand(approval),
              )
          }

          fn recover_indeterminate_inner(
              &mut self,
              previews: &mut PlanPreviewControl,
              principal: AuthenticatedPrincipal,
              actor: Actor,
              request: PlanDesiredStateRequest,
              approval: RecoveryApproval,
          ) -> Result<DurableRecoveryOutcome, DurableAuthorityError> {
          '''
          if "recover_indeterminate_inner" not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"recovery function marker count={text.count(old)}")
              text = text.replace(old, new, 1)

          old = '''                let now_unix_ms = self.authority_now_unix_ms()?;
              let next_binding = self.revalidate_and_bind(
                  &candidate,
                  approval_evidence_id.as_ref(),
                  now_unix_ms,
              )?;
          '''
          new = '''                let approval_evidence_id = match &approval {
                  RecoveryApproval::Existing(existing) => existing.clone(),
                  RecoveryApproval::OnDemand(approval) => match candidate.review.decision() {
                      PolicyDecision::Allow => None,
                      PolicyDecision::RequireApproval { .. } => Some(
                          self.issue_approval(
                              approval.request_id.clone(),
                              &candidate,
                              &approval.approver,
                              approval.expires_at_unix_seconds,
                          )?
                          .id()
                          .clone(),
                      ),
                      PolicyDecision::Deny { .. } | PolicyDecision::Blocked { .. } => {
                          return Err(DurableAuthorityError::CandidateBlocked);
                      }
                  },
              };
              let now_unix_ms = self.authority_now_unix_ms()?;
              let next_binding = self.revalidate_and_bind(
                  &candidate,
                  approval_evidence_id.as_ref(),
                  now_unix_ms,
              )?;
          '''
          if old in text:
              text = text.replace(old, new, 1)
          durable.write_text(text, encoding="utf-8")

          lib = Path("crates/linura-control/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          old = "    MANAGED_SYSTEMD_CAPABILITY, MANAGED_SYSTEMD_OPERATION, MANAGED_SYSTEMD_PROVIDER,\n"
          new = "    MANAGED_SYSTEMD_CAPABILITY, MANAGED_SYSTEMD_INTENT_ORIGIN, MANAGED_SYSTEMD_OPERATION,\n    MANAGED_SYSTEMD_PROVIDER,\n"
          if "MANAGED_SYSTEMD_INTENT_ORIGIN" not in text:
              if text.count(old) != 1:
                  raise SystemExit("control managed export marker not found")
              text = text.replace(old, new, 1)
          durable_export = "    DurableRecoveryOutcome, PreparedDurableAuthority, VerifiedDurableAuthority,\n"
          if "FreshRecoveryApproval" not in text:
              if text.count(durable_export) != 1:
                  raise SystemExit("durable export marker not found")
              text = text.replace(
                  durable_export,
                  "    DurableRecoveryOutcome, FreshRecoveryApproval, PreparedDurableAuthority,\n    VerifiedDurableAuthority,\n",
                  1,
              )
          lib.write_text(text, encoding="utf-8")

          qualification = Path("crates/linura-control/src/v06_qualification.rs")
          text = qualification.read_text(encoding="utf-8")
          old = "    Actor, ActorId, ActorKind, Capability, CapabilityId, PrincipalId, ProviderId, RequestId,\n"
          new = "    Actor, ActorId, ActorKind, Capability, CapabilityId, IntentId, PrincipalId, ProviderId,\n    RequestId,\n"
          if "IntentId" not in text.split("use linura_core::{",1)[1].split("};",1)[0]:
              if text.count(old) != 1:
                  raise SystemExit("qualification core import marker not found")
              text = text.replace(old, new, 1)
          old = "    ManagedLifecycleControl, ManagedLifecycleError, ManagedMutationReceipt, PlanPreviewControl,\n"
          new = "    MANAGED_SYSTEMD_INTENT_ORIGIN, ManagedLifecycleControl, ManagedLifecycleError,\n    ManagedMutationReceipt, PlanPreviewControl,\n"
          if "MANAGED_SYSTEMD_INTENT_ORIGIN" not in text:
              if text.count(old) != 1:
                  raise SystemExit("qualification control import marker not found")
              text = text.replace(old, new, 1)
          old = "            intent_ids: vec![],\n            requirement_ids: vec![],\n            capability_ids: vec![],\n"
          new = "            intent_ids: vec![value(IntentId::new(MANAGED_SYSTEMD_INTENT_ORIGIN))],\n            requirement_ids: vec![],\n            capability_ids: vec![],\n"
          if old in text:
              text = text.replace(old, new, 1)
          qualification.write_text(text, encoding="utf-8")
          PY

      - name: Move Authority1 transport into linura-dbus
        run: |
          set -euo pipefail
          cat > crates/linura-dbus/src/authority.rs <<'RS'
          use std::fmt::{Debug, Formatter};
          use std::process::Command;
          use std::sync::{Arc, Mutex};

          use linura_control::{
              AuthenticatedPrincipal, ManagedMutationReceipt, TrustedHumanApproval,
          };
          use linura_core::{Actor, ActorId, ActorKind, PrincipalId};
          use zbus::message::Header;

          use super::{ContractAnnotatedInterface, authenticated_caller, fdo_failed};

          pub const AUTHORITY_SERVICE_NAME: &str = "org.linura.Authority1";
          pub const AUTHORITY_OBJECT_PATH: &str = "/org/linura/Authority1";
          pub const AUTHORITY_INTERFACE_NAME: &str = "org.linura.Authority1";
          pub const AUTHORITY_CONTRACT_ID: &str = "dbus.org.linura.Authority1";
          pub const AUTHORITY_CONTRACT_VERSION: &str = "1";
          pub const AUTHORITY_CONTRACT_STABILITY: &str = "experimental";
          pub const MANAGE_SYSTEMD_ACTIVE_STATE_ACTION: &str =
              "org.linura.authority.manage-systemd-active-state";

          const AUTHORITY_CONTRACT_ANNOTATIONS: [(&str, &str); 3] = [
              ("org.linura.ContractId", AUTHORITY_CONTRACT_ID),
              ("org.linura.ContractVersion", AUTHORITY_CONTRACT_VERSION),
              ("org.linura.Stability", AUTHORITY_CONTRACT_STABILITY),
          ];

          pub type AuthorityReceiptWire = (
              String,
              String,
              String,
              String,
              String,
              String,
              String,
              String,
              String,
              bool,
              Vec<String>,
          );

          pub struct Authority1Context {
              pub principal: AuthenticatedPrincipal,
              pub actor: Actor,
              pub approval: TrustedHumanApproval,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct Authority1ManagedRequest {
              pub operation_id: String,
              pub unit: String,
              pub desired_active_state: String,
              pub reason: String,
          }

          pub trait Authority1Handler: Send + 'static {
              fn converge_systemd_active_state(
                  &mut self,
                  context: Authority1Context,
                  request: Authority1ManagedRequest,
              ) -> Result<ManagedMutationReceipt, String>;
          }

          struct Authority1Service {
              handler: Arc<Mutex<Box<dyn Authority1Handler>>>,
          }

          impl Debug for Authority1Service {
              fn fmt(&self, formatter: &mut Formatter<'_>) -> std::fmt::Result {
                  formatter.debug_struct("Authority1Service").finish_non_exhaustive()
              }
          }

          impl Authority1Service {
              fn new(handler: impl Authority1Handler) -> Self {
                  Self {
                      handler: Arc::new(Mutex::new(Box::new(handler))),
                  }
              }

              async fn with_handler<R, F>(&self, operation: F) -> zbus::fdo::Result<R>
              where
                  R: Send + 'static,
                  F: FnOnce(&mut dyn Authority1Handler) -> Result<R, String> + Send + 'static,
              {
                  let handler = Arc::clone(&self.handler);
                  blocking::unblock(move || {
                      let mut guard = handler
                          .lock()
                          .map_err(|_| "Authority1 handler lock is poisoned".to_string())?;
                      operation(guard.as_mut())
                  })
                  .await
                  .map_err(fdo_failed)
              }
          }

          #[zbus::interface(name = "org.linura.Authority1")]
          impl Authority1Service {
              async fn converge_systemd_active_state(
                  &self,
                  operation_id: &str,
                  unit: &str,
                  desired_active_state: &str,
                  reason: &str,
                  #[zbus(connection)] connection: &zbus::Connection,
                  #[zbus(header)] header: Header<'_>,
              ) -> zbus::fdo::Result<AuthorityReceiptWire> {
                  let caller = authenticated_caller(connection, &header).await?;
                  let sender = caller.unique_bus_name.clone();
                  blocking::unblock(move || authorize_human_caller(&sender))
                      .await
                      .map_err(fdo_failed)?;

                  let principal = AuthenticatedPrincipal::new(format!("unix:uid:{}", caller.uid))
                      .map_err(|error| fdo_failed(error.to_string()))?;
                  let principal_id = PrincipalId::new(principal.as_str().to_owned())
                      .map_err(|error| fdo_failed(error.to_string()))?;
                  let actor = Actor {
                      id: ActorId::new(format!(
                          "authority-dbus:v1:{}:{}:uid:{}:pid:{}",
                          caller.unique_bus_name.len(),
                          caller.unique_bus_name,
                          caller.uid,
                          caller.pid
                      ))
                      .map_err(|error| fdo_failed(error.to_string()))?,
                      kind: ActorKind::Human,
                      interactive: true,
                  };
                  let context = Authority1Context {
                      principal,
                      actor,
                      approval: TrustedHumanApproval::from_privileged_local_boundary(principal_id),
                  };
                  let request = Authority1ManagedRequest {
                      operation_id: operation_id.to_owned(),
                      unit: unit.to_owned(),
                      desired_active_state: desired_active_state.to_owned(),
                      reason: reason.to_owned(),
                  };

                  self.with_handler(move |handler| {
                      handler
                          .converge_systemd_active_state(context, request)
                          .map(receipt_wire)
                  })
                  .await
              }
          }

          fn authorize_human_caller(sender: &str) -> Result<(), String> {
              let status = Command::new("/usr/bin/pkcheck")
                  .args([
                      "--action-id",
                      MANAGE_SYSTEMD_ACTIVE_STATE_ACTION,
                      "--system-bus-name",
                      sender,
                      "--allow-user-interaction",
                  ])
                  .status()
                  .map_err(|error| format!("Polkit authorization service is unavailable: {error}"))?;
              if status.success() {
                  Ok(())
              } else {
                  Err("administrator approval was denied or unavailable".into())
              }
          }

          fn receipt_wire(receipt: ManagedMutationReceipt) -> AuthorityReceiptWire {
              (
                  receipt.transaction_id,
                  receipt.plan_id,
                  receipt.resource,
                  receipt.desired_active_state,
                  receipt.effect_digest,
                  receipt.dispatch_digest.unwrap_or_default(),
                  receipt.execution_disposition.unwrap_or_default(),
                  receipt.verification_disposition,
                  receipt.final_state,
                  receipt.recovered,
                  receipt.stages,
              )
          }

          fn authority1_service(
              handler: impl Authority1Handler,
          ) -> ContractAnnotatedInterface<Authority1Service> {
              ContractAnnotatedInterface::new(
                  Authority1Service::new(handler),
                  &AUTHORITY_CONTRACT_ANNOTATIONS,
              )
          }

          pub fn serve_authority1(
              handler: impl Authority1Handler,
          ) -> Result<(), super::TransportError> {
              let service = authority1_service(handler);
              let _connection = zbus::blocking::connection::Builder::system()?
                  .name(AUTHORITY_SERVICE_NAME)?
                  .serve_at(AUTHORITY_OBJECT_PATH, service)?
                  .build()?;
              loop {
                  std::thread::park();
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use zbus::object_server::Interface;

              struct NeverCalled;

              impl Authority1Handler for NeverCalled {
                  fn converge_systemd_active_state(
                      &mut self,
                      _context: Authority1Context,
                      _request: Authority1ManagedRequest,
                  ) -> Result<ManagedMutationReceipt, String> {
                      Err("not called by introspection".into())
                  }
              }

              #[test]
              fn authority_contract_is_explicitly_experimental() {
                  assert_eq!(AUTHORITY_SERVICE_NAME, "org.linura.Authority1");
                  assert_eq!(AUTHORITY_INTERFACE_NAME, "org.linura.Authority1");
                  assert_eq!(AUTHORITY_CONTRACT_ID, "dbus.org.linura.Authority1");
                  assert_eq!(AUTHORITY_CONTRACT_VERSION, "1");
                  assert_eq!(AUTHORITY_CONTRACT_STABILITY, "experimental");
              }

              #[test]
              fn live_authority_introspection_matches_canonical_surface() {
                  let service = authority1_service(NeverCalled);
                  let mut live = String::new();
                  service.introspect_to_writer(&mut live, 0);
                  let canonical =
                      include_str!("../../../interfaces/dbus/org.linura.Authority1.xml");

                  for &(name, value) in &AUTHORITY_CONTRACT_ANNOTATIONS {
                      let marker = format!("name=\"{name}\" value=\"{value}\"");
                      assert_eq!(canonical.matches(&marker).count(), 1, "canonical {name}");
                      assert_eq!(live.matches(&marker).count(), 1, "live {name}");
                  }
                  let method = "<method name=\"ConvergeSystemdActiveState\">";
                  assert!(canonical.contains(method));
                  assert!(live.contains(method));
                  for argument in [
                      "operation_id",
                      "unit",
                      "desired_active_state",
                      "reason",
                  ] {
                      let marker = format!("name=\"{argument}\" type=\"s\" direction=\"in\"");
                      assert!(canonical.contains(&marker), "canonical {argument}");
                      assert!(live.contains(&marker), "live {argument}");
                  }
                  assert_eq!(canonical.matches("direction=\"out\"").count(), 11);
                  assert_eq!(live.matches("direction=\"out\"").count(), 11);
              }
          }
          RS

          cat > interfaces/dbus/org.linura.Authority1.xml <<'XML'
          <!DOCTYPE node PUBLIC "-//freedesktop//DTD D-BUS Object Introspection 1.0//EN" "https://www.freedesktop.org/standards/dbus/1.0/introspect.dtd">
          <node>
            <interface name="org.linura.Authority1">
              <annotation name="org.linura.ContractId" value="dbus.org.linura.Authority1"/>
              <annotation name="org.linura.ContractVersion" value="1"/>
              <annotation name="org.linura.Stability" value="experimental"/>
              <method name="ConvergeSystemdActiveState">
                <arg name="operation_id" type="s" direction="in"/>
                <arg name="unit" type="s" direction="in"/>
                <arg name="desired_active_state" type="s" direction="in"/>
                <arg name="reason" type="s" direction="in"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="s" direction="out"/>
                <arg type="b" direction="out"/>
                <arg type="as" direction="out"/>
              </method>
            </interface>
          </node>
          XML

          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/linura-dbus/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          if "mod authority;" not in text:
              text = text.replace("mod planning;\n", "mod authority;\nmod planning;\n", 1)
          export = '''pub use authority::{
              AUTHORITY_CONTRACT_ID, AUTHORITY_CONTRACT_STABILITY, AUTHORITY_CONTRACT_VERSION,
              AUTHORITY_INTERFACE_NAME, AUTHORITY_OBJECT_PATH, AUTHORITY_SERVICE_NAME,
              Authority1Context, Authority1Handler, Authority1ManagedRequest, AuthorityReceiptWire,
              MANAGE_SYSTEMD_ACTIVE_STATE_ACTION, serve_authority1,
          };
          '''
          if "pub use authority::" not in text:
              text = text.replace("mod planning;\n\n", "mod planning;\n\n" + export + "\n", 1)
          old = '''    let unique_bus_name = sender.as_str().to_string();
              let proxy = zbus::Proxy::new(
          '''
          new = '''    let unique_bus_name = sender.as_str().to_string();
              if !unique_bus_name.starts_with(':') || unique_bus_name.chars().any(char::is_control) {
                  return Err(fdo_failed("D-Bus sender is not a canonical unique bus name"));
              }
              let proxy = zbus::Proxy::new(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          lib.write_text(text, encoding="utf-8")

          stability = Path("contracts/stability.toml")
          text = stability.read_text(encoding="utf-8")
          entry = '''
          [[contract]]
          id = "dbus.org.linura.Authority1"
          kind = "dbus-interface"
          path = "interfaces/dbus/org.linura.Authority1.xml"
          version = "1"
          stability = "experimental"
          '''
          if 'id = "dbus.org.linura.Authority1"' not in text:
              control = '''[[contract]]
          id = "dbus.org.linura.Control1"
          kind = "dbus-interface"
          path = "interfaces/dbus/org.linura.Control1.xml"
          version = "1"
          stability = "experimental"
          '''
              if control not in text:
                  raise SystemExit("Control1 stability entry not found")
              text = text.replace(control, control + entry, 1)
          stability.write_text(text, encoding="utf-8")

          repo_check = Path("scripts/check_repository.py")
          text = repo_check.read_text(encoding="utf-8")
          marker = '"interfaces/dbus/org.linura.Control1.xml", ".cargo/config.toml",'
          if "interfaces/dbus/org.linura.Authority1.xml" not in text:
              if marker not in text:
                  raise SystemExit("repository required-interface marker not found")
              text = text.replace(
                  marker,
                  '"interfaces/dbus/org.linura.Control1.xml", "interfaces/dbus/org.linura.Authority1.xml", ".cargo/config.toml",',
                  1,
              )
          repo_check.write_text(text, encoding="utf-8")
          PY

      - name: Make linura-authorityd a narrow composition package
        run: |
          set -euo pipefail
          cat > apps/linura-authorityd/src/systemd_adapter.rs <<'RS'
          use std::fmt::{Debug, Formatter};

          use linura_control::{
              AuthorizedEffect, AuthorizedEffectExecutor, IndependentManagedVerifier,
              MANAGED_SYSTEMD_CAPABILITY, MANAGED_SYSTEMD_OPERATION, MANAGED_SYSTEMD_PROVIDER,
          };
          use linura_core::CapabilityId;
          use linura_executor_systemd::{
              INTERFACE_NAME as EXECUTOR_INTERFACE, ManagedActiveState, ManagedUnitName,
              OBJECT_PATH as EXECUTOR_OBJECT, SERVICE_NAME as EXECUTOR_SERVICE,
              managed_active_state_effect,
          };
          use linura_linux_observation::SystemdObserver;
          use linura_provider_sdk::{
              ComponentDigest, EffectDescriptor, ExecutionDisposition, ExecutionOutcome,
              IndependentVerifier as _, Observer as _, VerificationOutcome,
          };
          use linura_verifier_systemd::{SystemdActiveStateExpectation, SystemdActiveStateVerifier};

          type ExecutorOutcomeWire = (String, String, String);

          pub(crate) struct SystemdExecutorClient {
              connection: zbus::blocking::Connection,
          }

          impl Debug for SystemdExecutorClient {
              fn fmt(&self, formatter: &mut Formatter<'_>) -> std::fmt::Result {
                  formatter
                      .debug_struct("SystemdExecutorClient")
                      .finish_non_exhaustive()
              }
          }

          impl SystemdExecutorClient {
              pub(crate) fn connect() -> Result<Self, String> {
                  zbus::blocking::Connection::system()
                      .map(|connection| Self { connection })
                      .map_err(|error| {
                          format!("cannot connect to system bus for executor handoff: {error}")
                      })
              }
          }

          impl AuthorizedEffectExecutor for SystemdExecutorClient {
              fn execute_authorized(
                  &mut self,
                  authorization: AuthorizedEffect,
              ) -> Result<ExecutionOutcome, String> {
                  let (effect, binding) = authorization.into_executor_request();
                  let (unit, state) = parse_managed_effect(&effect)?;
                  let proxy = zbus::blocking::Proxy::new(
                      &self.connection,
                      EXECUTOR_SERVICE,
                      EXECUTOR_OBJECT,
                      EXECUTOR_INTERFACE,
                  )
                  .map_err(|error| format!("cannot bind managed executor proxy: {error}"))?;

                  let wire: ExecutorOutcomeWire = proxy
                      .call(
                          "SetManagedActiveState",
                          &(
                              unit.as_str(),
                              state.as_str(),
                              binding.transaction_id.as_str(),
                              binding.generation,
                              binding.state_version,
                              binding.authority_binding_digest.to_hex(),
                              binding.authority_use_digest.to_hex(),
                              binding.effect_digest.to_hex(),
                              binding.dispatch_digest.to_hex(),
                          ),
                      )
                      .map_err(|error| format!("managed executor transport failed: {error}"))?;

                  let disposition = match wire.0.as_str() {
                      "rejected-before-dispatch" => ExecutionDisposition::RejectedBeforeDispatch,
                      "dispatched" => ExecutionDisposition::Dispatched,
                      "indeterminate" => ExecutionDisposition::Indeterminate,
                      value => return Err(format!("executor returned unknown disposition {value:?}")),
                  };
                  let dispatch_digest = if wire.1.is_empty()
                      && disposition == ExecutionDisposition::RejectedBeforeDispatch
                  {
                      binding.dispatch_digest
                  } else {
                      ComponentDigest::parse_hex(&wire.1).map_err(|error| {
                          format!("executor returned malformed dispatch digest: {error}")
                      })?
                  };
                  if dispatch_digest != binding.dispatch_digest {
                      return Err(
                          "executor response substituted the authorized dispatch digest".into(),
                      );
                  }
                  ExecutionOutcome::new(disposition, dispatch_digest, wire.2)
                      .map_err(|error| format!("executor returned invalid outcome: {error}"))
              }
          }

          pub(crate) struct FreshSystemdVerifier {
              observer: SystemdObserver,
              verifier: SystemdActiveStateVerifier,
          }

          impl Debug for FreshSystemdVerifier {
              fn fmt(&self, formatter: &mut Formatter<'_>) -> std::fmt::Result {
                  formatter
                      .debug_struct("FreshSystemdVerifier")
                      .finish_non_exhaustive()
              }
          }

          impl FreshSystemdVerifier {
              pub(crate) fn connect() -> Result<Self, String> {
                  Ok(Self {
                      observer: SystemdObserver::connect().map_err(|error| {
                          format!("cannot connect independent systemd observer: {error}")
                      })?,
                      verifier: SystemdActiveStateVerifier,
                  })
              }
          }

          impl IndependentManagedVerifier for FreshSystemdVerifier {
              fn verify_effect(
                  &mut self,
                  effect: &EffectDescriptor,
              ) -> Result<VerificationOutcome, String> {
                  let (unit, state) = parse_managed_effect(effect)?;
                  let expectation =
                      SystemdActiveStateExpectation::new(unit.as_str(), state.as_str())
                          .map_err(|error| error.to_string())?;
                  let capability = CapabilityId::new(MANAGED_SYSTEMD_CAPABILITY)
                      .map_err(|error| error.to_string())?;
                  let observation = self
                      .observer
                      .observe_authoritative(&effect.resource, &capability)
                      .map_err(|error| format!("independent systemd observation failed: {error}"))?;
                  Ok(self.verifier.verify(&expectation, &observation))
              }
          }

          pub(crate) fn parse_managed_effect(
              effect: &EffectDescriptor,
          ) -> Result<(ManagedUnitName, ManagedActiveState), String> {
              if effect.provider.as_str() != MANAGED_SYSTEMD_PROVIDER
                  || effect.operation != MANAGED_SYSTEMD_OPERATION
              {
                  return Err("effect is outside the v0.6 managed systemd contract".into());
              }
              let payload = std::str::from_utf8(&effect.canonical_payload)
                  .map_err(|_| "managed effect payload is not UTF-8".to_string())?;
              let mut lines = payload.lines();
              let unit = lines
                  .next()
                  .and_then(|line| line.strip_prefix("unit="))
                  .ok_or_else(|| "managed effect is missing canonical unit".to_string())?;
              let state = lines
                  .next()
                  .and_then(|line| line.strip_prefix("active_state="))
                  .ok_or_else(|| "managed effect is missing canonical active state".to_string())?;
              if lines.next().is_some() || !payload.ends_with('\n') {
                  return Err("managed effect payload has trailing or non-canonical material".into());
              }
              let unit = ManagedUnitName::parse(unit).map_err(|error| error.to_string())?;
              let state = ManagedActiveState::parse(state).map_err(str::to_owned)?;
              let canonical =
                  managed_active_state_effect(&unit, state).map_err(|error| error.to_string())?;
              if canonical != *effect {
                  return Err("managed effect differs from the executor canonical encoding".into());
              }
              Ok((unit, state))
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn canonical_effect_parser_rejects_extra_payload_material() {
                  let unit = ManagedUnitName::parse("linura-managed-example.service")
                      .unwrap_or_else(|error| unreachable!("{error}"));
                  let effect = managed_active_state_effect(&unit, ManagedActiveState::Active)
                      .unwrap_or_else(|error| unreachable!("{error}"));
                  let parsed =
                      parse_managed_effect(&effect).unwrap_or_else(|error| unreachable!("{error}"));
                  assert_eq!(parsed.0, unit);
                  assert_eq!(parsed.1, ManagedActiveState::Active);
              }
          }
          RS

          cat > apps/linura-authorityd/src/runtime.rs <<'RS'
          use std::collections::BTreeMap;
          use std::env;
          use std::fs::{self, File, OpenOptions};
          use std::io::{Read, Write};
          use std::os::unix::fs::{OpenOptionsExt, PermissionsExt};
          use std::path::{Path, PathBuf};

          use linura_control::{
              MANAGED_SYSTEMD_CAPABILITY, MANAGED_SYSTEMD_INTENT_ORIGIN, MANAGED_SYSTEMD_PROVIDER,
              ManagedLifecycleControl, PlanPreviewControl, managed_request_id,
          };
          use linura_core::{CapabilityId, IntentId, ProviderId, RequestId, SemanticReason};
          use linura_dbus::{Authority1Context, Authority1Handler, Authority1ManagedRequest};
          use linura_executor_systemd::{ManagedActiveState, ManagedUnitName};
          use linura_linux_observation::SystemdObserver;
          use linura_observation_control::ObservationCoordinator;
          use linura_persistence_sqlite::{SqliteIntegrityKey, SqliteTransactionStore};
          use linura_protocol::PlanDesiredStateRequest;
          use linura_transaction::TransactionAuthorityKey;

          use crate::systemd_adapter::{FreshSystemdVerifier, SystemdExecutorClient};

          const DEFAULT_STATE_DIR: &str = "/var/lib/linura-authority";
          const STATE_DIR_ENV: &str = "LINURA_AUTHORITY_STATE_DIR";
          const AUTHORITY_KEY_FILE: &str = "transaction-authority.key";
          const INTEGRITY_KEY_FILE: &str = "sqlite-integrity.key";
          const DATABASE_FILE: &str = "authority.sqlite3";
          const SECRET_BYTES: usize = 32;
          const MAX_REASON_BYTES: usize = 1024;

          #[derive(Debug)]
          pub(crate) struct ManagedRuntime {
              control: ManagedLifecycleControl<SqliteTransactionStore>,
              executor: SystemdExecutorClient,
              verifier: FreshSystemdVerifier,
          }

          impl ManagedRuntime {
              pub(crate) fn open(state_dir: &Path) -> Result<Self, String> {
                  prepare_state_dir(state_dir)?;
                  let authority_bytes = load_or_create_secret(&state_dir.join(AUTHORITY_KEY_FILE))?;
                  let integrity_bytes = load_or_create_secret(&state_dir.join(INTEGRITY_KEY_FILE))?;

                  let authority_key = TransactionAuthorityKey::new(authority_bytes)
                      .map_err(|error| format!("invalid transaction authority key: {error}"))?;
                  let (authority_signer, authority_verifier) = authority_key.split();
                  let integrity_key = SqliteIntegrityKey::new(integrity_bytes)
                      .map_err(|error| format!("invalid SQLite integrity key: {error}"))?;
                  let store = SqliteTransactionStore::open(
                      state_dir.join(DATABASE_FILE),
                      authority_verifier,
                      integrity_key,
                  )
                  .map_err(|error| format!("cannot open durable authority store: {error}"))?;

                  let control_observer = SystemdObserver::connect().map_err(|error| {
                      format!("cannot connect authoritative systemd observer: {error}")
                  })?;
                  let mut coordinator = ObservationCoordinator::new();
                  coordinator
                      .register_observer(Box::new(control_observer))
                      .map_err(|error| {
                          format!("cannot register authoritative systemd observer: {error}")
                      })?;
                  let previews = PlanPreviewControl::new(coordinator);
                  let control = ManagedLifecycleControl::new(previews, store, authority_signer)
                      .map_err(|error| error.to_string())?;

                  Ok(Self {
                      control,
                      executor: SystemdExecutorClient::connect()?,
                      verifier: FreshSystemdVerifier::connect()?,
                  })
              }
          }

          impl Authority1Handler for ManagedRuntime {
              fn converge_systemd_active_state(
                  &mut self,
                  context: Authority1Context,
                  request: Authority1ManagedRequest,
              ) -> Result<linura_control::ManagedMutationReceipt, String> {
                  let request = managed_request(&request)?;
                  let Self {
                      control,
                      executor,
                      verifier,
                  } = self;
                  control
                      .converge_systemd_active_state(
                          context.principal,
                          context.actor,
                          request,
                          &context.approval,
                          executor,
                          verifier,
                      )
                      .map_err(|error| error.to_string())
              }
          }

          fn managed_request(wire: &Authority1ManagedRequest) -> Result<PlanDesiredStateRequest, String> {
              if wire.reason.is_empty()
                  || wire.reason.len() > MAX_REASON_BYTES
                  || wire.reason.chars().any(char::is_control)
              {
                  return Err("reason must be 1..1024 bytes without control characters".into());
              }
              let unit = ManagedUnitName::parse(&wire.unit).map_err(|error| error.to_string())?;
              let state =
                  ManagedActiveState::parse(&wire.desired_active_state).map_err(str::to_owned)?;
              let resource = unit.resource_id().map_err(|error| error.to_string())?;
              let mut request = PlanDesiredStateRequest {
                  request_id: RequestId::new("request:v06:pending")
                      .map_err(|error| error.to_string())?,
                  provider: ProviderId::new(MANAGED_SYSTEMD_PROVIDER)
                      .map_err(|error| error.to_string())?,
                  resource,
                  observation_capability: CapabilityId::new(MANAGED_SYSTEMD_CAPABILITY)
                      .map_err(|error| error.to_string())?,
                  reason: SemanticReason {
                      summary: wire.reason.clone(),
                      intent_ids: vec![
                          IntentId::new(MANAGED_SYSTEMD_INTENT_ORIGIN)
                              .map_err(|error| error.to_string())?,
                      ],
                      requirement_ids: vec![],
                      capability_ids: vec![],
                  },
                  desired_state: BTreeMap::from([(
                      "active_state".to_owned(),
                      state.as_str().to_owned(),
                  )]),
              };
              request.request_id = managed_request_id(&wire.operation_id, &request)
                  .map_err(|error| error.to_string())?;
              Ok(request)
          }

          fn prepare_state_dir(path: &Path) -> Result<(), String> {
              fs::create_dir_all(path)
                  .map_err(|error| format!("cannot create authority state dir: {error}"))?;
              let metadata = fs::metadata(path).map_err(|error| error.to_string())?;
              if !metadata.is_dir() {
                  return Err("authority state path is not a directory".into());
              }
              let mode = metadata.permissions().mode() & 0o777;
              if mode & 0o077 != 0 {
                  fs::set_permissions(path, fs::Permissions::from_mode(0o700))
                      .map_err(|error| {
                          format!("cannot harden authority state directory: {error}")
                      })?;
              }
              Ok(())
          }

          fn load_or_create_secret(path: &Path) -> Result<Vec<u8>, String> {
              match fs::read(path) {
                  Ok(bytes) => {
                      validate_secret_file(path, &bytes)?;
                      Ok(bytes)
                  }
                  Err(error) if error.kind() == std::io::ErrorKind::NotFound => create_secret(path),
                  Err(error) => Err(format!("cannot read {}: {error}", path.display())),
              }
          }

          fn validate_secret_file(path: &Path, bytes: &[u8]) -> Result<(), String> {
              if bytes.len() != SECRET_BYTES || bytes.iter().all(|byte| *byte == 0) {
                  return Err(format!("{} is not a non-zero 256-bit secret", path.display()));
              }
              let metadata = fs::metadata(path).map_err(|error| error.to_string())?;
              if metadata.permissions().mode() & 0o077 != 0 {
                  return Err(format!("{} permissions are broader than 0600", path.display()));
              }
              Ok(())
          }

          fn create_secret(path: &Path) -> Result<Vec<u8>, String> {
              let mut random = File::open("/dev/urandom")
                  .map_err(|error| format!("cannot open kernel random source: {error}"))?;
              let mut bytes = vec![0_u8; SECRET_BYTES];
              random
                  .read_exact(&mut bytes)
                  .map_err(|error| format!("cannot read kernel random source: {error}"))?;
              if bytes.iter().all(|byte| *byte == 0) {
                  return Err("kernel random source returned an invalid all-zero secret".into());
              }
              let mut file = OpenOptions::new()
                  .write(true)
                  .create_new(true)
                  .mode(0o600)
                  .open(path)
                  .map_err(|error| format!("cannot create {}: {error}", path.display()))?;
              file.write_all(&bytes)
                  .and_then(|()| file.sync_all())
                  .map_err(|error| {
                      format!("cannot durably provision {}: {error}", path.display())
                  })?;
              validate_secret_file(path, &bytes)?;
              Ok(bytes)
          }

          pub(crate) fn state_dir() -> PathBuf {
              env::var_os(STATE_DIR_ENV)
                  .map(PathBuf::from)
                  .unwrap_or_else(|| PathBuf::from(DEFAULT_STATE_DIR))
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn managed_wire(unit: &str, state: &str) -> Authority1ManagedRequest {
                  Authority1ManagedRequest {
                      operation_id: "activate-test".into(),
                      unit: unit.into(),
                      desired_active_state: state.into(),
                      reason: "test convergence".into(),
                  }
              }

              #[test]
              fn public_request_surface_is_exactly_the_reserved_managed_effect() {
                  let request = managed_request(&managed_wire(
                      "linura-managed-example.service",
                      "active",
                  ))
                  .unwrap_or_else(|error| unreachable!("{error}"));
                  assert_eq!(request.provider.as_str(), MANAGED_SYSTEMD_PROVIDER);
                  assert_eq!(
                      request.observation_capability.as_str(),
                      MANAGED_SYSTEMD_CAPABILITY
                  );
                  assert_eq!(
                      request.resource.as_str(),
                      "systemd:unit:linura-managed-example.service"
                  );
                  assert_eq!(
                      request.desired_state.get("active_state").map(String::as_str),
                      Some("active")
                  );
                  assert_eq!(
                      request.reason.intent_ids[0].as_str(),
                      MANAGED_SYSTEMD_INTENT_ORIGIN
                  );
                  assert!(managed_request(&managed_wire("sshd.service", "active")).is_err());
                  assert!(
                      managed_request(&managed_wire(
                          "linura-managed-example.service",
                          "failed"
                      ))
                      .is_err()
                  );
              }
          }
          RS

